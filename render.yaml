services:
  - type: web
    name: dropbox-index
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm vp build
    startCommand: pnpm start
    envVars:
      - key: APP_ID
        value: ""
      - key: APP_SECRET
        value: ""
      - key: REFRESH_TOKEN
        value: ""
      - key: TITLE
        value: PublicBox
